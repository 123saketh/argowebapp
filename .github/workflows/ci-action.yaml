name: Build Step

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  kiuwan-scan:
    name: Kiuwan security scan test
    runs-on: ubuntu-latest
    env:
      # --- Kiuwan configuration ---
      APPLICATION_NAME: "TestEquity - Spire BluePrint"
      KIUWAN_API_URL: "https://api.kiuwan.com"
      KIUWAN_USER: "sdahagam"          # ⚠️ for testing only
      KIUWAN_PASS: "12!@PeckEpfo"      # ⚠️ for testing only
    steps:            
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Poll Kiuwan Status and Compare Defects
        if: github.event_name == 'pull_request'
        id: check_quality_gate
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=30
          ATTEMPT=0
          STATUS="EXECUTING"
          NEW_VULNERABILITIES_JSON="[]"
          REMOVED_VULNERABILITIES_JSON="[]"
          NEW_VULNERABILITIES_COUNT=0
          ANALYSIS_CODE='A-7e9-19a25a8d6da'
          URL_ENCODED_APP_NAME=$(echo "${{ env.APPLICATION_NAME }}" | sed 's/ /%20/g')
      
          echo "Fetching baseline 'develop' analysis..."
          ANALYSES=$(curl -s --user "${{ env.KIUWAN_USER }}:${{ env.KIUWAN_PASS }}" \
            "${{ env.KIUWAN_API_URL }}/applications/analyses?application=$URL_ENCODED_APP_NAME&count=30&filterPurgedAnalyses=true&success=true")
      
          BASELINE_CODE=$(echo "$ANALYSES" | jq -r '[.[] | select(.label == "develop" and .analysisScope == "Baseline")] | sort_by(.creationDate) | last | .code')
      
          if [ "$BASELINE_CODE" == "null" ] || [ -z "$BASELINE_CODE" ]; then
            echo "Warning: No baseline found for 'develop'."
            echo "quality_gate_status=NO_BASELINE" >> $GITHUB_OUTPUT
            exit 0
          fi
      
          echo "Baseline analysis code: $BASELINE_CODE"
      
          while [ "$STATUS" == "EXECUTING" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Waiting for analysis to finish... Attempt $((ATTEMPT+1))"
            sleep $SLEEP_SECONDS
            API_RESPONSE=$(curl -s --user "${{ env.KIUWAN_USER }}:${{ env.KIUWAN_PASS }}" \
              "${{ env.KIUWAN_API_URL }}/apps/analysis/$ANALYSIS_CODE")
            STATUS=$(echo "$API_RESPONSE" | jq -r '.analysisStatus // empty')
            ATTEMPT=$((ATTEMPT+1))
          done
      
          if [ "$STATUS" != "FINISHED" ]; then
            echo "Analysis not completed in time. Status: $STATUS"
            echo "quality_gate_status=IN_PROGRESS" >> $GITHUB_OUTPUT
            exit 0
          fi
      
          COMPARE_SUMMARY=$(curl -s --user "${{ env.KIUWAN_USER }}:${{ env.KIUWAN_PASS }}" \
            "${{ env.KIUWAN_API_URL }}/apps/analysis/$ANALYSIS_CODE/defects/compare/$BASELINE_CODE")
      
          echo "--- DEBUG: RAW COMPARE_SUMMARY ---"
          echo "$COMPARE_SUMMARY"
          echo "-----------------------------------"
      
          NEW_DEFECTS_COUNT_RAW=$(echo "$COMPARE_SUMMARY" | jq -r '."New defects count" // 0')
          REMOVED_DEFECTS_COUNT_RAW=$(echo "$COMPARE_SUMMARY" | jq -r '."Removed defects count" // 0')
      
          if [ "$NEW_DEFECTS_COUNT_RAW" -gt 0 ]; then
            echo "Found $NEW_DEFECTS_COUNT_RAW new defects. Filtering for SAST only..."
      
            SECURITY_RULES_RESPONSE=$(curl -s --user "${{ env.KIUWAN_USER }}:${{ env.KIUWAN_PASS }}" \
              "${{ env.KIUWAN_API_URL }}/violatedrules?application=$URL_ENCODED_APP_NAME&code=$ANALYSIS_CODE&characteristic=Security&onlyCodeSecurity=true")
      
            SECURITY_RULE_CODES=$(echo "$SECURITY_RULES_RESPONSE" | jq -rc '
              if (type=="array") then
                [ .[] | select(type=="object" and has("ruleCode")) | .ruleCode ] | unique
              elif (type=="object" and has("ruleCode")) then
                [ .ruleCode ]
              else
                []
              end
            ' 2>/dev/null)
      
            # Validate SECURITY_RULE_CODES
            if [ -z "$SECURITY_RULE_CODES" ] || [ "$SECURITY_RULE_CODES" = "null" ]; then
              SECURITY_RULE_CODES="[]"
            fi
      
            if ! echo "$SECURITY_RULE_CODES" | jq empty 2>/dev/null; then
              echo "SECURITY_RULE_CODES is not valid JSON. Defaulting to empty array."
              SECURITY_RULE_CODES="[]"
            fi
      
            echo "--- DEBUG: SECURITY RULE CODES ---"
            echo "$SECURITY_RULE_CODES" | jq .
            echo "----------------------------------"

            echo $SECURITY_RULE_CODES
            # This ensures it is always strict, compact JSON, safe for --argjson.
            SECURITY_RULE_CODES_SAFE=$(echo "$SECURITY_RULE_CODES" | jq -c .)
            echo $SECURITY_RULE_CODES_SAFE
      
            FULL_NEW_DEFECTS_JSON=$(curl -s --user "${{ env.KIUWAN_USER }}:${{ env.KIUWAN_PASS }}" \
              "${{ env.KIUWAN_API_URL }}/apps/analysis/$ANALYSIS_CODE/defects/compare/$BASELINE_CODE/new")
      
            echo $FULL_NEW_DEFECTS_JSON

            echo "Got FULL_NEW_DEFECTS_JSON"

            JQ_FILTER='
            if (type == "object" and has("New defects")) then
                (."New defects" // [])
                | map(
                    select(
                        type == "object"
                        and has("ruleCode")
                        and has("rule")
                        and (.muted | not)
                        and any($security_rules[]; . == .ruleCode)
                    )
                )
                | map({file: .file, rule: .rule, priority: .priority})
            else
                []
            end
            '
            
            echo "$JQ_FILTER"
            
            # Execution of jq using the single-line variable
            NEW_VULNERABILITIES_JSON=$(
                echo "$FULL_NEW_DEFECTS_JSON" | 
                jq -c --argjson security_rules "$SECURITY_RULE_CODES_SAFE" "$JQ_FILTER" 2>/dev/null
            )
            jq_exit=$?
            
            echo "Came here"
      
            if [ $jq_exit -ne 0 ] || [ -z "$NEW_VULNERABILITIES_JSON" ] || [ "$NEW_VULNERABILITIES_JSON" = "null" ]; then
              echo "Warning: jq filtering failed or returned invalid JSON. Defaulting to []."
              echo "Raw JSON: $FULL_NEW_DEFECTS_JSON"
              NEW_VULNERABILITIES_JSON="[]"
            fi

             echo $NEW_VULNERABILITIES_JSON

            echo "Got NEW_VULNERABILITIES_JSON"
      
            echo "--- DEBUG: NEW VULNERABILITIES JSON ---"
            echo "$NEW_VULNERABILITIES_JSON" | jq .
            echo "--------------------------------------"
      
            NEW_VULNERABILITIES_COUNT=$(echo "$NEW_VULNERABILITIES_JSON" | jq 'length')
          fi
      
          if [ "$REMOVED_DEFECTS_COUNT_RAW" -gt 0 ]; then
            FULL_REMOVED_DEFECTS_JSON=$(curl -s --user "${{ env.KIUWAN_USER }}:${{ env.KIUWAN_PASS }}" \
              "${{ env.KIUWAN_API_URL }}/apps/analysis/$ANALYSIS_CODE/defects/compare/$BASELINE_CODE/removed")
      
            REMOVED_VULNERABILITIES_JSON=$(echo "$FULL_REMOVED_DEFECTS_JSON" | jq -c '
              if (type == "object" and has("Removed defects")) then
                (."Removed defects" // [])
                | map(select(type=="object" and has("ruleCode") and has("rule") and (.muted | not)))
                | map({file: .file, rule: .rule, priority: .priority})
              else
                []
              end
            ' 2>/dev/null)
          fi
      
          echo "New SAST Vulnerabilities: $NEW_VULNERABILITIES_COUNT"
          echo "new_vulnerabilities=$NEW_VULNERABILITIES_JSON" >> $GITHUB_OUTPUT
          echo "removed_vulnerabilities=$REMOVED_VULNERABILITIES_JSON" >> $GITHUB_OUTPUT
      
          if [ "$NEW_VULNERABILITIES_COUNT" -gt 0 ]; then
            echo "quality_gate_status=FAILED" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "quality_gate_status=PASSED" >> $GITHUB_OUTPUT
          fi
